[project]
name = "ambrogio"
version = "0.1.0"
description = "Ambrogio: proactive signals for City of Milan decision makers (heat x older people living alone pilot)."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.scripts]
ambrogio = "ambrogio.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-playwright>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ambrogio"]

[tool.pytest.ini_options]
# `uv run pytest` runs the unit tests only.
# E2E has its own entrypoint: `uv run pytest tests/e2e` (see tests/e2e/README.md).
testpaths = ["tests/unit"]
addopts = "-ra"
